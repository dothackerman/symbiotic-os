[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "symbiotic-os"
version = "0.1.0"
description = "Symbiotic OS — local event bus for agentic systems"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
